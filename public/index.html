<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q-Messenger</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%233390ec'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>Q</text></svg>">
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth" class="auth-screen">
  <div class="auth-card">
    <div class="auth-title" id="authTitle">Войдите в Q-Messenger</div>
    <div class="auth-hint" id="authHint">Укажите email и пароль</div>

    <form id="authForm">
      <div id="regNameWrap" class="hidden">
        <label>Имя пользователя</label>
        <input id="fUsername" type="text" placeholder="username" autocomplete="off" maxlength="20">
      </div>
      <label>Электронная почта</label>
      <input id="fEmail" type="email" placeholder="you@example.com" autocomplete="username">
      <label>Пароль</label>
      <input id="fPassword" type="password" placeholder="Пароль" autocomplete="current-password">
      <div class="auth-error" id="authError"></div>
      <button type="submit" class="tg-btn" id="authBtn">Войти</button>
    </form>

    <form id="verifyForm" class="hidden">
      <div class="verify-email" id="verifyEmail"></div>
      <label>Код из письма — 6 цифр</label>
      <input id="fCode" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
      <div class="auth-error" id="verifyError"></div>
      <button type="submit" class="tg-btn">Подтвердить</button>
      <div class="auth-switch" style="margin-top:14px"><a href="#" id="resendLink">Отправить код ещё раз</a></div>
    </form>

    <div class="auth-switch" id="switchWrap">
      <span id="switchText">На аккаунте ещё нет?</span> <a href="#" id="authToggle">Создать аккаунт</a>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">
  <!-- chat list -->
  <aside class="sidebar">
    <div class="sb-top">
      <button class="burger" id="burgerBtn" title="Меню">Q</button>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14Z"/></svg>
        <input id="chatSearch" placeholder="Поиск" autocomplete="off">
      </div>
      <button class="plus-btn" id="newChatBtn" title="Создать">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <!-- chat -->
  <main class="chat">
    <header class="chat-head" id="chatHead">
      <div class="ch-avatar" id="headAvatar"></div>
      <div class="ch-titles" id="chTitles">
        <div class="ch-name" id="headName"></div>
        <div class="ch-status" id="headStatus"></div>
      </div>
      <button class="tg-icon hidden" id="callAudioBtn" title="Аудиозвонок">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/></svg>
      </button>
      <button class="tg-icon hidden" id="callVideoBtn" title="Видеозвонок">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4Z"/></svg>
      </button>
      <button class="tg-icon" id="themeBtn" title="Тема">
        <svg id="themeIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10ZM2 13h3a1 1 0 1 0 0-2H2a1 1 0 1 0 0 2Zm17 0h3a1 1 0 1 0 0-2h-3a1 1 0 1 0 0 2ZM11 2v3a1 1 0 1 0 2 0V2a1 1 0 1 0-2 0Zm0 17v3a1 1 0 1 0 2 0v-3a1 1 0 1 0-2 0ZM5.05 6.46 2.81 4.22a1 1 0 0 1 1.41-1.41l2.24 2.24a1 1 0 0 1-1.41 1.41Zm13.9 11.08 2.24 2.24a1 1 0 0 1-1.41 1.41l-2.24-2.24a1 1 0 0 1 1.41-1.41ZM4.22 19.8l2.24-2.24a1 1 0 1 1 1.41 1.41l-2.24 2.24a1 1 0 1 1-1.41-1.41ZM19.8 5.64l-2.24 2.24a1 1 0 0 1-1.41-1.41l2.24-2.24a1 1 0 1 1 1.41 1.41Z"/></svg>
      </button>
      <button class="tg-icon" id="contactBtn" title="Контакты">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M15 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm-9-1a3 3 0 1 0-3-3 3 3 0 0 0 3 3Zm9 2c-2.33 0-7 1.17-7 3.5V19h14v-1.5c0-2.33-4.67-3.5-7-3.5Zm-9 1c-2.18 0-6 1.1-6 3.3V19h6v-1.5c0-1.34.72-2.55 1.89-3.52A13 13 0 0 0 6 15Z"/></svg>
        <span class="tbadge hidden" id="reqBadge"></span>
      </button>
      <button class="tg-icon hidden" id="logoutBtn" title="Выйти">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5ZM4 5v14c0 1.1.9 2 2 2h7v-2H6V5h7V3H6c-1.1 0-2 .9-2 2Z"/></svg>
      </button>
    </header>

    <div class="messages" id="messages"></div>
    <div class="typing-row" id="typingRow"></div>

    <div class="composer">
      <div class="comp-field">
        <input id="input" placeholder="Сообщение" maxlength="2000" autocomplete="off">
      </div>
      <button class="send-btn" id="sendBtn" title="Отправить">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M2 21 23 12 2 3 2 10l15 2-15 2v7z" fill="currentColor"/></svg>
      </button>
    </div>
  </main>
</div>

<!-- ============ MODALS ============ -->
<div class="modal-back hidden" id="contactModal">
  <div class="modal">
    <div class="modal-head">
      <button class="tg-icon" id="contactBack"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg></button>
      <div class="modal-title">Контакты</div>
      <div class="seg-tabs">
        <button class="stab active" data-tab="list">Мои</button>
        <button class="stab" data-tab="req">Заявки <span id="pendCount"></span></button>
        <button class="stab" data-tab="add">Добавить</button>
      </div>
    </div>
    <div class="modal-body" id="contactBody"></div>
  </div>
</div>

<!-- new chat -->
<div class="modal-back hidden" id="createModal">
  <div class="modal">
    <div class="modal-head">
      <button class="tg-icon" id="createBack"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg></button>
      <div class="modal-title" id="createTitle">Новая группа</div>
    </div>
    <div class="modal-body">
      <div class="add-box" style="padding:4px 8px">
        <input class="add-input" id="groupName" placeholder="Название группы" maxlength="40">
        <div class="type-radio">
          <label><input type="radio" name="ctype" value="group" checked> Группа — все могут писать</label>
          <label><input type="radio" name="ctype" value="channel"> Канал — пишут только админы</label>
        </div>
        <div class="cl-label" style="padding-left:0">Добавить участников</div>
        <div id="memberPicks"></div>
        <div class="fs-hint hidden" id="noContactsHint" style="padding:12px">Сначала добавьте контакты</div>
        <button class="tg-btn" id="createGo">Создать</button>
      </div>
    </div>
  </div>
</div>

<!-- chat info -->
<div class="modal-back hidden" id="chatInfoModal">
  <div class="modal">
    <div class="modal-head">
      <button class="tg-icon" id="chatInfoBack"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg></button>
      <div class="modal-title">Информация</div>
    </div>
    <div class="modal-body" id="chatInfoBody"></div>
  </div>
</div>

<!-- settings -->
<div class="modal-back hidden" id="settingsModal">
  <div class="modal">
    <div class="modal-head">
      <button class="tg-icon" id="settingsBack"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg></button>
      <div class="modal-title">Настройки</div>
    </div>
    <div class="modal-body">
      <div class="set-avatar-wrap">
        <label class="set-avatar" id="setAvatar"><input type="file" id="avatarFile" accept="image/*" hidden></label>
        <div class="set-avatar-cap">Фото профиля</div>
      </div>
      <div class="add-box" style="padding:0 8px 8px">
        <label class="set-label">Отображаемое имя</label>
        <input class="add-input" id="setName" maxlength="40" placeholder="Имя">
        <label class="set-label">Имя пользователя</label>
        <input class="add-input" id="setUsername" maxlength="20" placeholder="username">
        <label class="set-label">О себе</label>
        <input class="add-input" id="setAbout" maxlength="120" placeholder="Пара слов о себе">
        <label class="set-label">Новый пароль (не обязательно)</label>
        <input class="add-input" id="setPassword" type="password" placeholder="••••••">
        <div class="set-info" id="setEmailLine"></div>
        <button class="tg-btn" id="settingsSave">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ CALL ============ -->
<div class="call-overlay hidden" id="callOverlay">
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="call-face" id="callFace">
    <div id="callAvatar"></div>
    <div class="call-name" id="callName"></div>
    <div class="call-state" id="callState"></div>
  </div>
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="call-actions">
    <button class="call-btn mic hidden" id="micBtn" title="Микрофон">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5.3-3a5.3 5.3 0 0 1-10.6 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-1.7Z"/></svg>
    </button>
    <button class="call-btn cam hidden" id="camBtn" title="Камера">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4Z"/></svg>
    </button>
    <button class="call-btn hangup hidden" id="hangupBtn" title="Завершить">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .4-.23.76-.6.92-.98-.41-1.87-.97-2.68-1.65a1.01 1.01 0 0 1-.11-1.52L6.55 8.4a.99.99 0 0 1 .96-.24c.89-.27 1.81-.46 2.76-.56L12 5.03h-.01C16.4 5.03 20 8.6 20 12.96V14l-2.3 1.6c-.77.54-1.63.94-2.55 1.14a1 1 0 0 1-1-.98v-3.65A9.4 9.4 0 0 0 12 9Z"/></svg>
    </button>
    <button class="call-btn accept hidden" id="acceptBtn" title="Ответить">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/></svg>
    </button>
    <button class="call-btn decline hidden" id="declineBtn" title="Отклонить">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="transform:rotate(135deg)"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/></svg>
    </button>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div class="ctx hidden" id="ctx"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
